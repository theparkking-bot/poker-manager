<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b15"><title>Poker Manager 1.0 by theparkking</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f3f5f1;background:#071b15;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #45624d;background:#173b2d;color:#f5f6f2;border-radius:11px;padding:11px 13px}button:disabled{opacity:.45}button.primary{background:#e9bd62;color:#1a2017;border-color:#f0ce85;font-weight:750}button.danger{border-color:#8b605b;color:#ffcbc5;background:#392523}button.ghost{background:transparent}input,select,textarea{width:100%;background:#0d281f;color:#fff;border:1px solid #45624d;border-radius:10px;padding:11px;min-width:0}label{display:block;color:#b6c8bd;font-size:.85rem;margin:9px 0 5px}.wrap{max-width:750px;margin:auto;padding:15px 14px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{color:#e8bd67;font-family:Georgia,serif;font-size:1.45rem;font-weight:bold}.sub{color:#a6b8aa;font-size:.8rem}.card{background:#0d291f;border:1px solid #355744;border-radius:16px;padding:14px;margin:12px 0}.muted{color:#a8b9ad}.gold{color:#f2c76e}.center{text-align:center}.hero{padding:22px 8px 15px;background:linear-gradient(160deg,#0c3023,#071a14);border:1px solid #56714b;border-radius:19px;margin:12px 0}.blinds{font-size:clamp(3.6rem,15vw,6.6rem);line-height:1.12;font-weight:850;letter-spacing:-.055em;color:#f4c767;white-space:nowrap}.clock{font-size:clamp(4rem,17vw,7rem);font-weight:850;letter-spacing:-.05em;line-height:1.2;font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#123729;border-radius:11px;padding:10px 4px;text-align:center}.stat b{display:block;margin-top:4px;font-size:1.04rem}.tiny{font-size:.72rem;color:#b0c0b3}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#061711f5;border-top:1px solid #36543e;padding:6px 5px calc(6px + env(safe-area-inset-bottom));z-index:5}.tabs>div{width:min(750px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.tabs button{border:0;background:transparent;padding:7px 0;font-size:.74rem;color:#b3c2b6}.tabs button.active{color:#f3c76a;font-weight:800}.pill{display:inline-block;border:1px solid #51724f;border-radius:20px;padding:5px 9px;color:#b6e1bd;font-size:.76rem}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions>*{flex:1}.list{display:grid;gap:7px}.item{background:#102e23;border:1px solid #2e5040;border-radius:11px;padding:11px}.item .row{flex-wrap:wrap}.smallbtn{padding:6px 9px;font-size:.8rem}.section{margin-top:18px;color:#f2cb76;font-weight:750}.progress{height:7px;background:#264538;border-radius:10px;overflow:hidden;margin:12px}.progress div{height:100%;background:#e8ba5c}.modalwrap{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.modal{background:#0c261d;border:1px solid #648063;border-radius:17px;padding:17px;width:min(490px,100%);max-height:88vh;overflow:auto}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #294536;padding:9px 5px;text-align:left}th{color:#c9b47a;font-size:.8rem}h2{margin:14px 0 8px;font-size:1.3rem}h3{margin:10px 0}.hint{font-size:.83rem;color:#afc0b2}.fullscreen{position:fixed;inset:0;z-index:20;background:#04130e;display:flex;align-items:center;justify-content:center;padding:20px}.screen{width:min(900px,100%);text-align:center}.fullscreen .blinds{font-size:clamp(4rem,18vw,10rem)}.fullscreen .clock{font-size:clamp(5rem,21vw,12rem)}@media(min-width:600px){.wrap{padding-top:25px}.grid{gap:12px}}@media(max-width:360px){button{padding:9px 8px}.brand{font-size:1.18rem}}
</style></head><body><div id="app"></div><script>
const KEY='poker_manager_1_0_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{tournaments:[],profiles:[],selected:null}}catch{db={tournaments:[],profiles:[],selected:null}};
let tab='tournament',modal=null,screen=false,decisionEnd=0,decisionOwner=null,decisionTick=0,notification='',currentSearch='',playerFilter='active';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const defaultLevels=()=>{let a=[[25,25],[25,50],[50,75],[75,100],[100,125],[125,150],[150,175],[175,200],[200,225],[225,250]];let sb=225,bb=250;while(a.length<45){let step=x=>x<500?25:x<1000?50:100;sb+=step(sb);bb+=step(bb);a.push([sb,bb])}return a.map(([sb,bb],i)=>({sb,bb,min:i<9?18:15}))};
function newTournament(name){return {id:id(),name:name||'Турнир № '+(db.tournaments.length+1),created:Date.now(),status:'active',stage:'late',lateCloseLevel:9,level:0,levels:defaultLevels(),remaining:18*60,deadline:null,paused:true,players:[],events:[],buyin:1000,rebuy:1000,addon:500,reentry:1000,startingChips:10000,rebuyChips:10000,addonChips:5000,ante:false,anteStart:10,anteType:'bb',anteAmount:1,dealerPct:10,paidPlaces:3,payouts:[],breaks:[],tables:[{id:id(),name:'Стол 1',seats:10}],history:[],notes:'',dealerPaid:0,holdNext:false}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Не удалось сохранить данные. Экспортируйте резервную копию.')}}
const t=()=>db.tournaments.find(x=>x.id===db.selected);const live=x=>x?Math.max(0,x.deadline?Math.ceil((x.deadline-Date.now())/1000):x.remaining):0;
function log(x,msg){x.events.unshift({at:Date.now(),msg});if(x.events.length>1000)x.events.pop()}
function notify(s){notification=s;render();setTimeout(()=>{if(notification===s){notification='';render()}},3500)}
function act(fn){let x=t();if(!x)return;let before=JSON.stringify(x);fn(x);x.history.push(before);if(x.history.length>30)x.history.shift();save();render()}
function undo(){let x=t();if(!x||!x.history.length)return;let old=JSON.parse(x.history.pop()),hist=x.history;Object.assign(x,old);x.history=hist;save();render()}
function pause(x){x.remaining=live(x);x.deadline=null;x.paused=true}
function play(x){x.deadline=Date.now()+x.remaining*1000;x.paused=false}
function advance(x){x.level=Math.min(x.level+1,x.levels.length-1);x.remaining=duration(x)*60;if(x.level>=x.lateCloseLevel&&x.stage==='late'){x.stage='addon';log(x,'Поздняя регистрация закрыта; начался этап аддонов')}log(x,'Уровень '+(x.level+1));if(!x.paused)play(x)}
function duration(x){return x.stage==='final'?12:x.stage==='late'?18:15}
function sync(){let changed=false;for(const x of db.tournaments){if(x.status!=='active'||x.paused||!x.deadline)continue;let n=0;while(x.deadline<=Date.now()&&n++<150){if(x.holdNext){pause(x);log(x,'Ожидание окончания раздачи');changed=true;break}let old=x.deadline;advance(x);x.deadline=old+x.remaining*1000;changed=true}if(n>=150){pause(x);changed=true}}if(changed)save()}
function gross(x){return x.players.reduce((s,p)=>s+p.ops.filter(o=>!o.void).reduce((z,o)=>z+Number(o.amount||0),0),0)}
function received(x){return x.players.reduce((s,p)=>s+p.ops.filter(o=>!o.void&&o.paid).reduce((z,o)=>z+Number(o.amount||0),0),0)}
function net(x){return Math.round(gross(x)*(100-x.dealerPct))/100}
function active(x){return x.players.filter(p=>p.active).length}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function btn(label,code,cls=''){return `<button class="${cls}" onclick="${code}">${label}</button>`}
function eventText(x){return x.stage==='late'?'Поздняя регистрация':x.stage==='addon'?'Аддоны':x.stage==='final'?'Финальный стол':'Основная стадия'}
function levelHtml(x){let l=x.levels[x.level]||x.levels.at(-1),next=x.levels[x.level+1];return `<div class="hero center"><div class="muted">УРОВЕНЬ ${x.level+1} · БЛАЙНДЫ</div><div class="blinds">${l.sb.toLocaleString('ru-RU')} / ${l.bb.toLocaleString('ru-RU')}</div><div class="clock" id="mainClock">${fmt(live(x))}</div><div class="muted">${next?'Следующие: '+next.sb+' / '+next.bb:'Последний уровень'}</div>${x.ante&&x.level+1>=x.anteStart?`<div class="gold">Анте: ${x.anteType==='bb'?'BB Ante':'Каждый игрок'} · ${Math.round(l.bb*x.anteAmount)}</div>`:''}<div class="progress"><div id="bar" style="width:${Math.min(100,100*live(x)/(duration(x)*60))}%"></div></div><div class="tiny">${x.paused?'Пауза':'Идёт отсчёт'} · ${duration(x)} мин на уровень</div></div>`}
function nav(){return `<nav class="tabs"><div>${[['tournament','♠','Турнир'],['players','♙','Игроки'],['prizes','🏆','Призовые'],['history','◷','История'],['more','☰','Ещё']].map(([v,i,n])=>`<button class="${tab===v?'active':''}" onclick="tab='${v}';render()"><div style="font-size:1.25rem">${i}</div>${n}</button>`).join('')}</div></nav>`}
function home(){return `<div class="card"><h2>Мои турниры</h2><div class="list">${db.tournaments.map(x=>`<div class="item row between"><div><b>${esc(x.name)}</b><div class="tiny">${x.status==='active'?'Активный':'Завершён'} · ${new Date(x.created).toLocaleDateString('ru-RU')} · ${x.players.length} игроков</div></div>${btn('Открыть',`db.selected='${x.id}';tab='tournament';save();render()`,'smallbtn')}</div>`).join('')||'<p class="muted">Пока нет турниров.</p>'}</div><div class="actions" style="margin-top:12px">${btn('＋ Новый турнир',"openModal('create')",'primary')}${btn('⚡ Быстрый старт',"quickStart()")}</div></div>`}
function tournament(x){return `<div class="row between"><span class="pill">${esc(eventText(x))}</span><span class="pill">${x.status==='active'?'● Турнир идёт':'Завершён'}</span></div>${levelHtml(x)}<div class="grid"><div class="stat"><span class="tiny">В игре</span><b>${active(x)} / ${x.players.length}</b></div><div class="stat"><span class="tiny">Общий банк</span><b>${money(gross(x))}</b></div><div class="stat"><span class="tiny">Статус</span><b style="font-size:.83rem">${esc(eventText(x))}</b></div></div><div class="actions" style="margin-top:12px">${btn(x.paused?'▶ Продолжить':'Ⅱ Пауза',"act(x=>{x.paused?play(x):pause(x);log(x,x.paused?'Пауза':'Продолжение')})")}${btn('⏱ <span id="decisionLabel">30 сек на решение</span>',"decision()",'primary')}</div><div class="actions" style="margin-top:8px">${btn('Отменить 30 сек',"decisionEnd=0;decisionOwner=null;render()",'ghost')}${btn('＋ 1 мин',"act(x=>{x.remaining=live(x)+60;if(!x.paused)play(x);log(x,'Добавлена минута')})",'ghost')}${btn('Следующий уровень',"nextLevel()",'ghost')}</div><div class="actions" style="margin-top:8px">${btn('Стадии',"openModal('stages')")}${btn('Табло игроков',"screen=true;render()")}${btn('Изменить время',"openModal('time')")}</div><div class="section">Ближайшие уровни</div><div class="card scroll"><table><tr><th>Уровень</th><th>Блайнды</th><th>Время</th></tr>${x.levels.slice(x.level,Math.min(x.level+5,x.levels.length)).map((l,i)=>`<tr><td>${x.level+i+1}</td><td>${l.sb} / ${l.bb}</td><td>${x.stage==='final'?12:x.level+i<9?18:15} мин</td></tr>`).join('')}</table></div>`}
function players(x){let list=x.players.filter(p=>(playerFilter==='all'||(playerFilter==='active'?p.active:!p.active))&&p.name.toLowerCase().includes(currentSearch.toLowerCase()));return `<div class="row between"><h2>Игроки (${x.players.length})</h2>${btn('＋ Игрок',"openModal('addplayer')",'primary')}</div><input placeholder="Поиск игрока…" value="${esc(currentSearch)}" onchange="currentSearch=this.value;render()"><div class="actions" style="margin:12px 0">${[['active','В игре'],['out','Выбывшие'],['all','Все']].map(([k,v])=>btn(v,`playerFilter='${k}';render()`,playerFilter===k?'primary':'')).join('')}</div><div class="list">${list.map(p=>`<div class="item"><div class="row between"><div><b>${esc(p.name)}</b> <span class="tiny">${p.active?'● В игре':'○ Выбыл'} ${p.place?'· '+p.place+' место':''}</span><div class="tiny">Внесено: ${money(p.ops.reduce((a,o)=>a+(o.void?0:Number(o.amount)),0))} · Оплачено: ${money(p.ops.reduce((a,o)=>a+(o.void||!o.paid?0:Number(o.amount)),0))}</div></div>${btn('⋯',`openModal('player','${p.id}')`,'smallbtn')}</div><div class="actions" style="margin-top:8px">${p.active?`${btn('＋ Ребай',`addOp('${p.id}','rebuy')`,'smallbtn')}${btn('＋ Аддон',`addOp('${p.id}','addon')`,'smallbtn')}${btn('Выбыл',`eliminate('${p.id}')`,'smallbtn danger')}`:btn('Повторный вход',`reenter('${p.id}')`,'smallbtn')}</div></div>`).join('')||'<p class="muted">Игроки не найдены.</p>'}</div><div class="actions" style="margin-top:12px">${btn('Аддоны для всех',"openModal('massaddon')")}${btn('Рассадка',"openModal('seating')")}</div>`}
const presets={1:[100],2:[65,35],3:[50,30,20],4:[45,25,18,12],5:[40,25,15,12,8],6:[35,23,16,12,8,6],7:[32,22,15,11,9,6,5],8:[30,20,15,11,8,6,5,5],9:[28,19,14,11,8,6,5,5,4],10:[27,18,13,10,8,6,5,5,4,4]};
function percentages(x){return x.payouts.length===x.paidPlaces?x.payouts:presets[x.paidPlaces]||[100]}
function prizes(x){let p=percentages(x),pool=net(x);return `<h2>Призовые и выплаты</h2><div class="grid"><div class="stat"><span class="tiny">Общий банк</span><b>${money(gross(x))}</b></div><div class="stat"><span class="tiny">Дилерам ${x.dealerPct}%</span><b>${money(gross(x)-pool)}</b></div><div class="stat"><span class="tiny">Игрокам</span><b>${money(pool)}</b></div></div><div class="card"><div class="row between"><b>Призовых мест: ${x.paidPlaces}</b>${btn('Настроить',"openModal('prizes')",'smallbtn')}</div><table><tr><th>Место</th><th>Доля</th><th>Сумма</th><th>Выплата</th></tr>${p.map((pct,i)=>{let player=x.players.find(z=>z.place===i+1);return `<tr><td>${i+1}${player?' · '+esc(player.name):''}</td><td>${pct}%</td><td>${money(pool*pct/100)}</td><td>${player?`${money(player.payoutPaid||0)} ${btn('＋',`openModal('pay','${player.id}')`,'smallbtn')}`:'—'}</td></tr>`}).join('')}</table><p class="hint">До завершения аддонов суммы предварительные. Долги по взносам: ${money(gross(x)-received(x))}.</p></div><div class="actions">${btn('ICM / Делёжка',"openModal('icm')")}${btn('Завершить турнир',"finish()",'primary')}</div>`}
function history(x){return `<h2>История и заметки</h2><div class="card"><label>Заметки организатора</label><textarea rows="4" onblur="saveNotes(this.value)">${esc(x.notes)}</textarea></div><div class="card"><h3>Журнал действий</h3><div class="list">${x.events.map(e=>`<div class="item"><span class="tiny">${new Date(e.at).toLocaleString('ru-RU')}</span><div>${esc(e.msg)}</div></div>`).join('')||'<p class="muted">Пока нет событий.</p>'}</div></div>`}
function more(x){return `<h2>Управление</h2><div class="list">${[['Турниры',"db.selected=null;render()"],['Параметры турнира',"openModal('settings')"],['Структура блайндов',"openModal('levels')"],['Управление стадиями',"openModal('stages')"],['Столы и рассадка',"openModal('seating')"],['Отменить последнее действие',"undo()"],['Экспорт резервной копии',"exportBackup()"],['Импорт резервной копии',"$('importFile').click()"],['Поддержать проект',"openModal('support')"]].map(([a,b])=>btn(a,b)).join('')}</div><input type="file" accept="application/json" id="importFile" style="display:none" onchange="importBackup(this.files[0])"><div class="card"><b>Архив турниров</b><div class="list">${db.tournaments.filter(z=>z.status==='finished').map(z=>`<div class="item row between">${esc(z.name)} ${btn('Открыть',`db.selected='${z.id}';tab='tournament';save();render()`,'smallbtn')}</div>`).join('')||'<p class="muted">Пока пусто.</p>'}</div></div><p class="hint">Данные хранятся только в этом браузере. Регулярно экспортируйте резервную копию.</p>`}
function render(){sync();let x=t();$('app').innerHTML=screen&&x?`<div class="fullscreen"><div class="screen"><div class="row between"><span class="brand">${esc(x.name)}</span>${btn('✕',"screen=false;render()",'ghost')}</div><div class="muted" style="margin-top:25px">УРОВЕНЬ ${x.level+1}</div>${levelHtml(x)}<div class="muted">В игре: ${active(x)} · ${esc(eventText(x))}</div></div></div>`:`<main class="wrap"><div class="top"><div><div class="brand">♠ Poker Manager <span style="font:12px system-ui;color:#d9c690">1.0</span></div><div class="sub">by theparkking</div></div>${x?btn('⌄ '+esc(x.name),"db.selected=null;render()",'smallbtn'):''}</div>${notification?`<div class="card gold">${esc(notification)}</div>`:''}${x?tab==='tournament'?tournament(x):tab==='players'?players(x):tab==='prizes'?prizes(x):tab==='history'?history(x):more(x):home()}${x?nav():''}</main>`;if(modal)renderModal()}
function openModal(name,extra){modal={name,extra};renderModal()};function closeModal(){modal=null;render()}
function formModal(title,body,buttons=''){let el=document.createElement('div');el.className='modalwrap';el.id='modalRoot';el.innerHTML=`<div class="modal"><div class="row between"><h2>${title}</h2>${btn('✕',"closeModal()",'ghost')}</div>${body}${buttons}</div>`;document.body.appendChild(el)}
function val(k){return $(k)?.value};function num(k){return Number(val(k))||0};
function renderModal(){document.querySelector('#modalRoot')?.remove();let x=t(),m=modal;if(!m)return;let body='',title='',footer='';switch(m.name){
case 'create':title='Новый турнир';body=`<label>Название</label><input id="newName" placeholder="Вечерний турнир"><label>Шаблон</label><p class="hint">Один стол 10-max, 18/15/12 минут, анте выключено.</p>`;footer=btn('Создать',"createNow()",'primary');break;
case 'addplayer':title='Добавить игрока';body=`<label>Имя игрока</label><input id="playerName" placeholder="Имя"><label><input id="entryPaid" type="checkbox" checked style="width:auto"> Взнос оплачен</label>`;footer=btn('Добавить',"addPlayerNow()",'primary');break;
case 'player':{let p=x.players.find(z=>z.id===m.extra);title=esc(p.name);body=`<div class="pill">${p.active?'В игре':'Выбыл'}</div><label>Имя</label><input id="editPlayerName" value="${esc(p.name)}"><div class="actions" style="margin-top:10px">${btn('Сохранить имя',`renamePlayer('${p.id}')`)}${btn('Рассадка',"closeModal();openModal('seating')")}</div><h3>Операции</h3><div class="list">${p.ops.map(o=>`<div class="item row between"><div>${esc({buyin:'Вход',reentry:'Повторный вход',rebuy:'Ребай',addon:'Аддон'}[o.type])} · ${money(o.amount)}<div class="tiny">${o.paid?'Оплачено':'Не оплачено'} ${o.void?'· Отменено':''}</div></div>${!o.void?btn(o.paid?'Отменить':'Оплачено',`opAction('${p.id}','${o.id}','${o.paid?'void':'paid'}')`,'smallbtn'):''}</div>`).join('')}</div><label>Место выбывания (необязательно)</label><input id="playerPlace" type="number" min="1" max="${x.players.length}" value="${p.place||''}">${btn('Сохранить место',`setPlace('${p.id}')`)}<p class="hint">При одновременном выбывании порядок можно исправить вручную.</p>`;break}
case 'stages':title='Управление стадиями';body=`<div class="card">Текущая стадия: <b class="gold">${esc(eventText(x))}</b><p class="hint">Переход не сбрасывает оставшееся время. Основной таймер продолжает работать.</p></div><div class="list">${btn('Закрыть регистрацию → Аддоны',"changeStage('addon')",'primary')}${btn('Завершить аддоны → Основная стадия',"changeStage('main')")}${btn('Финальный стол · 12 минут',"changeStage('final')")}${btn('Вернуться к поздней регистрации',"changeStage('late')")}</div><label>Автозакрытие регистрации после уровня</label><input type="number" id="closeLevel" value="${x.lateCloseLevel}" min="1">${btn('Сохранить',"act(x=>{x.lateCloseLevel=Math.max(1,num('closeLevel'));log(x,'Изменено закрытие регистрации')});closeModal()")}`;break;
case 'time':title='Время и уровень';body=`<div class="fieldgrid"><div><label>Уровень</label><input type="number" id="newLevel" min="1" max="${x.levels.length}" value="${x.level+1}"></div><div><label>Осталось секунд</label><input type="number" id="newSeconds" min="0" value="${live(x)}"></div></div><label><input type="checkbox" id="holdNext" style="width:auto" ${x.holdNext?'checked':''}> Ожидать окончания раздачи перед сменой уровня</label>`;footer=btn('Применить',"act(x=>{x.level=Math.max(0,Math.min(x.levels.length-1,num('newLevel')-1));x.remaining=num('newSeconds');x.holdNext=$('holdNext').checked;if(!x.paused)play(x);log(x,'Время или уровень изменены')});closeModal()",'primary');break;
case 'settings':title='Настройки турнира';body=`<label>Название</label><input id="setName" value="${esc(x.name)}"><div class="fieldgrid">${[['buyin','Вход'],['reentry','Повторный вход'],['rebuy','Ребай'],['addon','Аддон'],['dealerPct','Дилерам, %'],['startingChips','Стартовых фишек'],['rebuyChips','Фишек за ребай'],['addonChips','Фишек за аддон']].map(([k,l])=>`<div><label>${l}</label><input type="number" id="set_${k}" value="${x[k]}"></div>`).join('')}</div><label><input type="checkbox" style="width:auto" id="setAnte" ${x.ante?'checked':''}> Включить анте</label><div class="fieldgrid"><div><label>Анте с уровня</label><input type="number" id="setAnteStart" value="${x.anteStart}"></div><div><label>Анте (множитель BB)</label><input type="number" step="0.1" id="setAnteAmount" value="${x.anteAmount}"></div></div><label>Тип анте</label><select id="setAnteType"><option value="bb" ${x.anteType==='bb'?'selected':''}>BB Ante</option><option value="each" ${x.anteType==='each'?'selected':''}>Каждый игрок</option></select>`;footer=btn('Сохранить',"saveSettings()",'primary');break;
case 'levels':title='Структура блайндов';body=`<div class="scroll"><table><tr><th>№</th><th>МБ</th><th>ББ</th></tr>${x.levels.map((l,i)=>`<tr><td>${i+1}</td><td><input type="number" min="1" id="sb_${i}" value="${l.sb}"></td><td><input type="number" min="1" id="bb_${i}" value="${l.bb}"></td></tr>`).join('')}</table></div>`;footer=btn('Сохранить уровни',"saveLevels()",'primary')+btn('Добавить уровень',"act(x=>{let l=x.levels.at(-1);x.levels.push({sb:l.sb+100,bb:l.bb+100})});closeModal();openModal('levels')")+btn('Удалить последний',"if(confirm('Удалить последний уровень?')){act(x=>{if(x.levels.length>x.level+1)x.levels.pop()});closeModal();openModal('levels')}")+btn('Стандартные уровни',"if(confirm('Восстановить стандартную структуру?')){act(x=>{x.levels=defaultLevels();x.level=0;pause(x);x.remaining=1080});closeModal()}");break;
case 'massaddon':title='Аддоны для игроков';body=`<p class="hint">Отметьте участников, которым нужно добавить аддон. Каждая отметка создаёт отдельную операцию.</p>${x.players.filter(p=>p.active).map(p=>`<label class="item"><input type="checkbox" class="addoncheck" value="${p.id}" style="width:auto"> ${esc(p.name)}</label>`).join('')}`;footer=btn('Добавить отмеченным',"massAddon()",'primary');break;
case 'prizes':title='Настройка призовых';body=`<label>Количество оплачиваемых мест (1–10)</label><input type="number" min="1" max="10" id="paidPlaces" value="${x.paidPlaces}"><p class="hint">После изменения числа мест нажмите «Применить», затем при необходимости настройте проценты.</p><div class="actions">${btn('Применить число мест',"setPaidPlaces()")}${btn('Вернуть проценты по умолчанию',"act(x=>{x.payouts=[]});closeModal();openModal('prizes')")}</div>${percentages(x).map((p,i)=>`<label>${i+1} место, %</label><input id="pct_${i}" type="number" step="0.01" value="${p}">`).join('')}`;footer=btn('Сохранить проценты',"savePayouts()",'primary');break;
case 'pay':{let p=x.players.find(z=>z.id===m.extra);title='Выплата: '+esc(p.name);body=`<p>Уже выплачено: ${money(p.payoutPaid||0)}</p><label>Добавить выплату, ₽</label><input type="number" id="payAmount" min="0" step="0.01">`;footer=btn('Записать выплату',`payPlayer('${p.id}')`,'primary');break}
case 'seating':title='Рассадка';body=`<p class="hint">Ручная рассадка по вытянутым бумажкам. По умолчанию стол на 10 мест.</p>${x.tables.map((table,ti)=>`<div class="card"><div class="row between"><b>${esc(table.name)} · ${table.seats}-max</b>${btn('＋ Место',`changeSeats(${ti},1)`,'smallbtn')}${btn('−',`changeSeats(${ti},-1)`,'smallbtn')}</div>${Array.from({length:table.seats},(_,i)=>`<div class="row" style="margin:7px 0"><span style="width:75px">Место ${i+1}</span><select onchange="seatPlayer('${table.id}',${i+1},this.value)"><option value="">Свободно</option>${x.players.map(p=>`<option value="${p.id}" ${p.table===table.id&&p.seat===i+1?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}`;footer=btn('＋ Добавить стол',"act(x=>x.tables.push({id:id(),name:'Стол '+(x.tables.length+1),seats:10}));closeModal();openModal('seating')")+btn('Случайная рассадка',"randomSeating()",'primary');break;
case 'icm':title='ICM · делёжка';body=`<p class="hint">Введите актуальные стеки вручную только для расчёта ICM. Стеки не будут храниться как текущий баланс игроков. В этой сборке ICM-калькулятор пока не реализован: для точной делёжки используйте ручное редактирование призовых.</p>${btn('Открыть призовые',"closeModal();openModal('prizes')")}`;break;
case 'support':title='Поддержать проект';body=`<p>Добровольная поддержка Poker Manager</p><label>USDT · только сеть TRC-20 (Tron)</label><div class="item" style="overflow-wrap:anywhere">TARZ8nN1cnXW7a2c6JnC4xCrFPP7EbV4hv</div>${btn('Скопировать адрес',"navigator.clipboard.writeText('TARZ8nN1cnXW7a2c6JnC4xCrFPP7EbV4hv');notify('Адрес скопирован');closeModal()",'primary')}<p>Обратная связь: <a style="color:#eac36f" href="mailto:the_park_king@yahoo.com">the_park_king@yahoo.com</a></p><p class="hint">Другие способы оплаты — скоро.</p>`;break;
}formModal(title,body,`<div class="actions" style="margin-top:15px">${footer}</div>`)}
function createNow(){let x=newTournament(val('newName').trim());db.tournaments.push(x);db.selected=x.id;save();closeModal()}
function quickStart(){let x=newTournament();db.tournaments.push(x);db.selected=x.id;save();render()}
function addPlayerNow(){let name=val('playerName').trim();if(!name)return alert('Введите имя');act(x=>{let p={id:id(),name,active:true,place:null,table:null,seat:null,payoutPaid:0,ops:[{id:id(),type:'buyin',amount:x.buyin,paid:$('entryPaid').checked,at:Date.now()}]};x.players.push(p);log(x,'Добавлен игрок '+name)});closeModal()}
function addOp(pid,type){let x=t(),p=x.players.find(z=>z.id===pid);if(type==='addon'&&x.stage==='late'&&!confirm('Этап аддонов ещё не начался. Всё равно добавить аддон?'))return;if(type==='rebuy'&&x.stage!=='late'&&!confirm('Поздняя регистрация закрыта. Всё равно добавить ребай?'))return;let paid=confirm('Взнос оплачен?\nОК — оплачен; Отмена — пока не оплачен.');act(x=>{let p=x.players.find(z=>z.id===pid);p.ops.push({id:id(),type,amount:x[type],paid,at:Date.now()});log(x,p.name+': '+type+' '+money(x[type]))})}
function eliminate(pid){if(!confirm('Отметить игрока выбывшим?'))return;act(x=>{let p=x.players.find(z=>z.id===pid);p.active=false;p.table=null;p.seat=null;if(x.stage!=='late'&&!p.place){let used=new Set(x.players.map(q=>q.place));let place=x.players.length;while(used.has(place)&&place>1)place--;p.place=place}log(x,p.name+' выбыл')})}
function reenter(pid){let x=t();if(x.stage!=='late')return alert('Повторный вход доступен только при открытой поздней регистрации');if(!confirm('Оформить повторный вход?'))return;let paid=confirm('Повторный вход оплачен?');act(x=>{let p=x.players.find(z=>z.id===pid);p.active=true;p.place=null;p.ops.push({id:id(),type:'reentry',amount:x.reentry,paid,at:Date.now()});log(x,p.name+' вернулся в игру')})}
function renamePlayer(pid){act(x=>{let p=x.players.find(z=>z.id===pid);p.name=val('editPlayerName').trim()||p.name;log(x,'Изменено имя игрока')});closeModal()}
function setPlace(pid){let place=num('playerPlace');if(place<1||place>t().players.length)return alert('Некорректное место');if(t().players.some(p=>p.id!==pid&&p.place===place))return alert('Место уже занято');act(x=>{x.players.find(z=>z.id===pid).place=place;log(x,'Изменён порядок выбывания')});closeModal()}
function opAction(pid,oid,action){if(action==='void'&&!confirm('Отменить операцию?'))return;act(x=>{let p=x.players.find(z=>z.id===pid),o=p.ops.find(z=>z.id===oid);if(action==='void')o.void=true;else o.paid=true;log(x,'Изменена операция игрока '+p.name)});closeModal()}
function massAddon(){let ids=[...document.querySelectorAll('.addoncheck:checked')].map(e=>e.value);if(!ids.length)return alert('Выберите игроков');let paid=confirm('Все отмеченные аддоны оплачены?');act(x=>{for(let pid of ids){let p=x.players.find(z=>z.id===pid);p.ops.push({id:id(),type:'addon',amount:x.addon,paid,at:Date.now()})}log(x,'Массовые аддоны: '+ids.length)});closeModal()}
function changeStage(s){if(!confirm('Перейти к стадии «'+({late:'Поздняя регистрация',addon:'Аддоны',main:'Основная стадия',final:'Финальный стол'}[s])+'»?'))return;act(x=>{let r=live(x);x.stage=s;x.remaining=r;if(!x.paused)play(x);log(x,'Стадия: '+eventText(x))});closeModal()}
function nextLevel(){if(!confirm('Перейти на следующий уровень?'))return;act(x=>{advance(x);log(x,'Ручное повышение блайндов')})}
function decision(){decisionOwner=t().id;decisionEnd=Date.now()+30000;render()}
function saveSettings(){act(x=>{x.name=val('setName').trim()||x.name;for(let k of ['buyin','reentry','rebuy','addon','dealerPct','startingChips','rebuyChips','addonChips'])x[k]=Math.max(0,num('set_'+k));x.dealerPct=Math.min(100,x.dealerPct);x.ante=$('setAnte').checked;x.anteStart=Math.max(1,num('setAnteStart'));x.anteAmount=num('setAnteAmount');x.anteType=val('setAnteType');log(x,'Настройки обновлены')});closeModal()}
function saveLevels(){let x=t(),ls=x.levels.map((l,i)=>({sb:num('sb_'+i),bb:num('bb_'+i)}));if(ls.some(l=>l.sb<1||l.bb<l.sb))return alert('Блайнды должны быть положительными, ББ не меньше МБ');act(x=>{x.levels=ls;log(x,'Структура блайндов обновлена')});closeModal()}
function setPaidPlaces(){let n=num('paidPlaces');if(n<1||n>10||n>t().players.length)return alert('От 1 до 10 мест, не больше числа игроков');act(x=>{x.paidPlaces=n;x.payouts=[];log(x,'Призовых мест: '+n)});closeModal();openModal('prizes')}
function savePayouts(){let arr=percentages(t()).map((_,i)=>num('pct_'+i));if(Math.abs(arr.reduce((a,b)=>a+b,0)-100)>.001)return alert('Сумма процентов должна равняться 100%');act(x=>{x.payouts=arr;log(x,'Изменено распределение призовых')});closeModal()}
function payPlayer(pid){let amt=num('payAmount');if(amt<=0)return alert('Укажите сумму');act(x=>{let p=x.players.find(z=>z.id===pid);p.payoutPaid=(p.payoutPaid||0)+amt;log(x,'Выплата '+p.name+': '+money(amt))});closeModal()}
function changeSeats(i,d){act(x=>{let table=x.tables[i];table.seats=Math.max(2,Math.min(10,table.seats+d));x.players.filter(p=>p.table===table.id&&p.seat>table.seats).forEach(p=>{p.table=null;p.seat=null})});closeModal();openModal('seating')}
function seatPlayer(tid,seat,pid){act(x=>{x.players.filter(p=>p.table===tid&&p.seat===seat).forEach(p=>{p.table=null;p.seat=null});if(pid){let p=x.players.find(z=>z.id===pid);p.table=tid;p.seat=seat}log(x,'Обновлена рассадка')});closeModal();openModal('seating')}
function randomSeating(){if(!confirm('Случайно пересадить всех активных игроков?'))return;act(x=>{let seats=x.tables.flatMap(table=>Array.from({length:table.seats},(_,i)=>({table:table.id,seat:i+1}))).sort(()=>Math.random()-.5);x.players.filter(p=>p.active).forEach((p,i)=>{p.table=seats[i]?.table||null;p.seat=seats[i]?.seat||null});log(x,'Случайная рассадка')});closeModal();openModal('seating')}
function saveNotes(value){act(x=>{x.notes=value;log(x,'Заметки обновлены')})}
function finish(){let x=t(),problems=[];if(x.stage==='late'||x.stage==='addon')problems.push('Регистрация или аддоны не завершены');if(x.players.some(p=>p.ops.some(o=>!o.void&&!o.paid)))problems.push('Есть неоплаченные взносы');if(x.players.some(p=>!p.active&&!p.place))problems.push('Не всем выбывшим назначены места');let paid=x.players.reduce((s,p)=>s+(p.payoutPaid||0),0);if(Math.abs(paid-net(x))>.01)problems.push('Выданные призовые не совпадают с фондом');if(problems.length&&!confirm('Проверка перед завершением:\n• '+problems.join('\n• ')+'\n\nВсё равно завершить?'))return;if(!problems.length&&!confirm('Завершить турнир?'))return;act(x=>{pause(x);x.status='finished';log(x,'Турнир завершён'+(problems.length?' с предупреждениями: '+problems.join('; '):''))})}
function exportBackup(){let blob=new Blob([JSON.stringify({format:'poker-manager-1',exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='poker-manager-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.format!=='poker-manager-1'||!Array.isArray(obj.data?.tournaments))throw Error('Некорректный файл');if(!confirm('Заменить текущую базу импортированной? Сначала сохраните резервную копию!'))return;db=obj.data;save();modal=null;render()}catch(e){alert('Ошибка импорта: '+e.message)}}
setInterval(()=>{sync();let x=t();if(x){let clock=$('mainClock');if(clock)clock.textContent=fmt(live(x));let bar=$('bar');if(bar)bar.style.width=Math.min(100,100*live(x)/(duration(x)*60))+'%';let d=$('decisionLabel');if(d)d.textContent=decisionOwner===x.id&&decisionEnd>Date.now()?fmt((decisionEnd-Date.now())/1000):'30 сек на решение';if(decisionEnd&&decisionEnd<=Date.now()){decisionEnd=0;decisionOwner=null;if(d)d.textContent='30 сек на решение'}}},250);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
