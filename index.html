</style></head><body><div id="app"></div><script>
const KEY='poker_manager_1_0_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{tournaments:[],profiles:[],selected:null}}catch{db={tournaments:[],profiles:[],selected:null}};
let toastTimer=null;let creatingTournament=false;let tab='tournament',modal=null,screen=false,decisionEnd=0,decisionOwner=null,decisionTick=0,notification='',currentSearch='',playerFilter='active';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const defaultLevels=()=>{let a=[[25,25],[25,50],[50,75],[75,100],[100,125],[125,150],[150,175],[175,200],[200,225],[225,250]];let sb=225,bb=250;while(a.length<45){let step=x=>x<500?25:x<1000?50:100;sb+=step(sb);bb+=step(bb);a.push([sb,bb])}return a.map(([sb,bb],i)=>({sb,bb,min:i<9?18:15}))};
function newTournament(name){return {id:id(),name:name||'Турнир № '+(db.tournaments.length+1),created:Date.now(),status:'active',stage:'late',lateCloseLevel:9,level:0,levels:defaultLevels(),remaining:18*60,deadline:null,paused:true,players:[],events:[],buyin:1000,rebuy:1000,addon:1000,reentry:1000,startingChips:10000,rebuyChips:10000,addonChips:10000,ante:false,anteStart:10,anteType:'bb',anteAmount:1,dealerPct:10,paidPlaces:3,payouts:[],bubblePlace:false,breaks:[],tables:[{id:id(),name:'Стол 1',seats:10}],history:[],notes:'',dealerPaid:0,holdNext:false,voiceBlinds:true,decisionVoice:true,decisionWarnAt:5}};
// Keep undo snapshots flat: older versions embedded history inside history,
// making each action exponentially larger until browser storage filled.
function cleanHistory(){for(const x of db.tournaments||[]){if(!Array.isArray(x.history))x.history=[];x.history=x.history.slice(-8).map(h=>{try{const v=JSON.parse(h);delete v.history;if(Array.isArray(v.events))v.events=v.events.slice(0,100);return JSON.stringify(v)}catch{return null}}).filter(Boolean)}}
function save(){
 try{cleanHistory();localStorage.setItem(KEY,JSON.stringify(db));return true}
 catch(e){
  // A second chance with no undo snapshots; never silently claim success.
  try{for(const x of db.tournaments||[])x.history=[];localStorage.setItem(KEY,JSON.stringify(db));showToast('Сохранено, но история отмены очищена из-за нехватки памяти.',true);return true}
  catch(e2){showToast('Не удалось сохранить изменения. Экспортируйте резервную копию и проверьте память браузера.',true);return false}
 }
}
function showToast(message,error=false){
 document.getElementById('pmToast')?.remove();clearTimeout(toastTimer);
 const el=document.createElement('div');el.id='pmToast';el.setAttribute('role','status');el.textContent=message;
 el.style.cssText='position:fixed;bottom:85px;left:50%;transform:translateX(-50%);max-width:min(92vw,480px);width:max-content;padding:13px 17px;border-radius:13px;background:'+(error?'#5b2825':'#174832')+';border:1px solid '+(error?'#f0a69c':'#cba45a')+';color:white;box-shadow:0 6px 30px #0009;z-index:1000;text-align:center;font-size:14px;cursor:pointer';
 el.onclick=()=>{el.remove();clearTimeout(toastTimer)};document.body.appendChild(el);
 toastTimer=setTimeout(()=>el.remove(),error?6500:2400);
}

const t=()=>db.tournaments.find(x=>x.id===db.selected);const live=x=>x?Math.max(0,x.deadline?Math.ceil((x.deadline-Date.now())/1000):x.remaining):0;
function log(x,msg){x.events.unshift({at:Date.now(),msg});if(x.events.length>1000)x.events.pop()}
function notify(s){notification=s;render();setTimeout(()=>{if(notification===s){notification='';render()}},3500)}
function act(fn,success){let x=t();if(!x)return false;cleanHistory();let before=JSON.stringify({...x,events:x.events.slice(0,100),history:[]});fn(x);x.history.push(before);if(x.history.length>8)x.history.shift();const ok=save();if(!ok){const previous=JSON.parse(before);Object.assign(x,previous);x.history=x.history.slice(0,-1)}render();if(ok&&success)showToast(success);return ok}
function undoDescription(x){
 if(!x||!x.history?.length)return null;
 let prev;try{prev=JSON.parse(x.history.at(-1))}catch{return 'последнее изменение турнира'}
 const beforeEvents=new Set((prev.events||[]).map(e=>e.at+'|'+e.msg));
 const added=(x.events||[]).filter(e=>!beforeEvents.has(e.at+'|'+e.msg));
 if(added.length)return added[0].msg;
 const oldPlayers=prev.players||[],newPlayers=x.players||[];
 const addedPlayer=newPlayers.find(p=>!oldPlayers.some(q=>q.id===p.id));
 if(addedPlayer)return 'Добавлен игрок «'+addedPlayer.name+'»';
 const removedPlayer=oldPlayers.find(p=>!newPlayers.some(q=>q.id===p.id));
 if(removedPlayer)return 'Удалён игрок «'+removedPlayer.name+'»';
 if(prev.level!==x.level)return 'Изменён уровень блайндов: '+(prev.level+1)+' → '+(x.level+1);
 if(prev.stage!==x.stage)return 'Изменена стадия турнира';
 if(prev.paused!==x.paused)return x.paused?'Таймер поставлен на паузу':'Таймер запущен';
 if(prev.remaining!==x.remaining)return 'Изменено время таймера';
 if(prev.name!==x.name)return 'Переименован турнир';
 if(JSON.stringify(prev.levels)!==JSON.stringify(x.levels))return 'Изменена структура блайндов';
 if(JSON.stringify(prev.payouts)!==JSON.stringify(x.payouts))return 'Изменено распределение призовых';
 if(JSON.stringify(prev.tables)!==JSON.stringify(x.tables))return 'Изменена рассадка или столы';
 return 'Последнее изменение турнира';
}
function undo(){let x=t();if(!x)return;if(!x.history?.length){alert('Нет действий для отмены.');return}
 const description=undoDescription(x);
 if(!confirm('Отменить действие?\n\n'+description+'\n\nТурнир вернётся к состоянию до этого действия.'))return;
 let old=JSON.parse(x.history.pop()),hist=x.history;Object.assign(x,old);x.history=hist;if(save())showToast('Действие отменено');render();}

function pause(x){x.remaining=live(x);x.deadline=null;x.paused=true}
function play(x){x.deadline=Date.now()+x.remaining*1000;x.paused=false}
function advance(x){x.level=Math.min(x.level+1,x.levels.length-1);x.remaining=duration(x)*60;if(x.level>=x.lateCloseLevel&&x.stage==='late'){x.stage='addon';log(x,'Поздняя регистрация закрыта; начался этап аддонов')}log(x,'Уровень '+(x.level+1));if(!x.paused)play(x)}
function duration(x){return x.stage==='final'?12:x.stage==='late'?18:15}
function sync(){let changed=false;for(const x of db.tournaments){if(x.status!=='active'||x.paused||!x.deadline)continue;let n=0;while(x.deadline<=Date.now()&&n++<150){if(x.holdNext){pause(x);log(x,'Ожидание окончания раздачи');changed=true;break}let old=x.deadline;advance(x);x.deadline=old+x.remaining*1000;changed=true}if(n>=150){pause(x);changed=true}}if(changed)save()}
function gross(x){return x.players.reduce((s,p)=>s+p.ops.filter(o=>!o.void).reduce((z,o)=>z+Number(o.amount||0),0),0)}
function received(x){return x.players.reduce((s,p)=>s+p.ops.filter(o=>!o.void&&o.paid).reduce((z,o)=>z+Number(o.amount||0),0),0)}
function net(x){return Math.round(gross(x)*(100-x.dealerPct))/100}
function active(x){return x.players.filter(p=>p.active).length}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function btn(label,code,cls=''){return `<button class="${cls}" onclick="${code}">${label}</button>`}
function eventText(x){return x.stage==='late'?'Поздняя регистрация':x.stage==='addon'?'Аддоны':x.stage==='final'?'Финальный стол':'Основная стадия'}
function levelHtml(x){let l=x.levels[x.level]||x.levels.at(-1),next=x.levels[x.level+1];return `<div class="hero center"><div class="muted">УРОВЕНЬ ${x.level+1} · БЛАЙНДЫ</div><div class="blinds">${l.sb.toLocaleString('ru-RU')} / ${l.bb.toLocaleString('ru-RU')}</div><div class="clock-line"><div class="clock" id="mainClock">${fmt(live(x))}</div></div><div class="hero-side-controls"><button class="speak-blinds" type="button" title="Озвучить текущие блайнды" aria-label="Озвучить текущие блайнды" onclick="speakCurrentBlinds()">🔊</button><button class="decision-side" type="button" title="30 секунд на решение" onclick="decision()">⏱ 30с</button></div><div class="muted">${next?'Следующие: '+next.sb+' / '+next.bb:'Последний уровень'}</div>${x.ante&&x.level+1>=x.anteStart?`<div class="gold">Анте: ${x.anteType==='bb'?'BB Ante':'Каждый игрок'} · ${Math.round(l.bb*x.anteAmount)}</div>`:''}<div class="progress"><div id="bar" style="width:${Math.min(100,100*live(x)/(duration(x)*60))}%"></div></div><div class="tiny">${x.paused?'Пауза':'Идёт отсчёт'} · ${duration(x)} мин на уровень</div></div>`}
function nav(){return `<nav class="tabs"><div>${[['tournament','♠','Турнир'],['players','♙','Игроки'],['prizes','🏆','Призовые'],['history','◷','История'],['more','☰','Ещё']].map(([v,i,n])=>`<button class="${tab===v?'active':''}" onclick="tab='${v}';render()"><div style="font-size:1.25rem">${i}</div>${n}</button>`).join('')}</div></nav>`}
function home(){return `<div class="card"><h2>Мои турниры</h2><div class="list">${db.tournaments.map(x=>`<div class="item row between"><div><b>${esc(x.name)}</b><div class="tiny">${x.status==='active'?'Активный':'Завершён'} · ${new Date(x.created).toLocaleDateString('ru-RU')} · ${x.players.length} игроков</div></div><div class="actions">${btn('Открыть',`db.selected='${x.id}';tab='tournament';render();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}`,'smallbtn')}${btn('Удалить',`deleteTournament('${x.id}')`,'smallbtn danger')}</div></div>`).join('')||'<p class="muted">Пока нет турниров.</p>'}</div><div class="actions" style="margin-top:12px">${btn('＋ Новый турнир',"openModal('create')",'primary')}${btn('⚡ Быстрый старт',"quickStart()")}</div></div>`}
function tournament(x){return `<div class="tournament-main"><div class="row between"><button class="pill" onclick="openModal('stages')" title="Управление стадиями">${esc(eventText(x))} ✎</button><span class="pill">${x.status==='active'?'● Турнир идёт':'Завершён'}</span></div>${levelHtml(x)}<div class="grid"><div class="stat clickable" role="button" tabindex="0" onclick="openModal('activeDetails')" onkeydown="if(event.key==='Enter')openModal('activeDetails')"><span class="tiny">В игре</span><b>${active(x)} / ${x.players.length}</b></div><div class="stat clickable" role="button" tabindex="0" onclick="openModal('bankDetails')" onkeydown="if(event.key==='Enter')openModal('bankDetails')"><span class="tiny">Общий банк</span><b>${money(gross(x))}</b></div><div class="stat clickable" role="button" tabindex="0" onclick="openModal('stages')" onkeydown="if(event.key==='Enter')openModal('stages')"><span class="tiny">Стадия · изменить</span><b style="font-size:.83rem">${esc(eventText(x))}</b></div></div><div class="actions key-actions" style="margin-top:12px"><button class="main-pause ${x.paused?'':'running'}" onclick="act(x=>{x.paused?play(x):pause(x);log(x,x.paused?'Пауза':'Продолжение')})">${x.paused?'▶ Продолжить отсчёт':'Ⅱ Пауза таймера'}</button></div><div class="actions player-actions" style="margin-top:8px">${btn('＋ Игрок',"openModal('addplayer')",'primary')}${btn('＋ Ребай',"openModal('quickop','rebuy')")}<div class="quick-break"></div><div class="addon-compact">${btn('＋ Аддон',"openModal('quickop','addon')")}</div>${btn('⚙ Управление',"openModal('manage')")}${btn('Табло',"screen=true;render()")}${btn('Время',"openModal('time')")}</div><div class="actions minute-actions" style="margin-top:8px">${btn('− 1 мин',"adjustMinute(-1)",'ghost')}${btn('＋ 1 мин',"adjustMinute(1)",'ghost')}${btn('◀ Предыдущий уровень',"previousLevel()",'ghost')}${btn('Следующий уровень ▶',"nextLevel()",'ghost')}</div><section class="upcoming-section"><div class="section">Ближайшие уровни</div><div class="card upcoming-card"><table><tr><th>Уровень</th><th>Блайнды</th><th>Время</th></tr>${x.levels.slice(Math.max(0,Math.min(x.level-2,x.levels.length-5)),Math.max(0,Math.min(x.level-2,x.levels.length-5))+5).map((l,j)=>{const i=Math.max(0,Math.min(x.level-2,x.levels.length-5))+j;return `<tr class="${i===x.level?'level-active':''}"><td>${i+1}${i===x.level?' ✓':''}</td><td>${l.sb.toLocaleString('ru-RU')} / ${l.bb.toLocaleString('ru-RU')}</td><td>${duration(x)} мин</td></tr>`}).join('')}</table></div></section></div>`}
function players(x){let list=x.players.filter(p=>(playerFilter==='all'||(playerFilter==='active'?p.active:!p.active))&&p.name.toLowerCase().includes(currentSearch.toLowerCase()));return `<div class="row between"><h2>Игроки (${x.players.length})</h2>${btn('＋ Игрок',"openModal('addplayer')",'primary')}</div><input placeholder="Поиск игрока…" value="${esc(currentSearch)}" onchange="currentSearch=this.value;render()"><div class="actions" style="margin:12px 0">${[['active','В игре'],['out','Выбывшие'],['all','Все']].map(([k,v])=>btn(v,`playerFilter='${k}';render()`,playerFilter===k?'primary':'')).join('')}</div><div class="list">${list.map(p=>`<div class="item"><div class="row between"><div><b>${esc(p.name)}</b> <span class="tiny">${p.active?'● В игре':'○ Выбыл'} ${p.place?'· '+p.place+' место':''}</span><div class="tiny">Внесено: ${money(p.ops.reduce((a,o)=>a+(o.void?0:Number(o.amount)),0))} · Оплачено: ${money(p.ops.reduce((a,o)=>a+(o.void||!o.paid?0:Number(o.amount)),0))}</div></div>${btn('⋯',`openModal('player','${p.id}')`,'smallbtn')}</div><div class="actions" style="margin-top:8px">${p.active?`${btn('＋ Ребай',`addOp('${p.id}','rebuy')`,'smallbtn')}${btn('＋ Аддон',`addOp('${p.id}','addon')`,'smallbtn')}${btn('Выбыл',`eliminate('${p.id}')`,'smallbtn danger')}${btn('Удалить',`deletePlayer('${p.id}')`,'smallbtn danger')}`: `${btn('Повторный вход',`reenter('${p.id}')`,'smallbtn')}${btn('Удалить',`deletePlayer('${p.id}')`,'smallbtn danger')}`}</div></div>`).join('')||'<p class="muted">Игроки не найдены.</p>'}</div><div class="actions" style="margin-top:12px">${btn('Аддоны для всех',"openModal('massaddon')")}${btn('Рассадка',"openModal('seating')")}</div>`}
const presets={1:[100],2:[65,35],3:[45,30,25],4:[40,25,20,15],5:[40,30,15,10,5],6:[35,23,16,12,8,6],7:[32,22,15,11,9,6,5],8:[30,20,15,11,8,6,5,5],9:[28,19,14,11,8,6,5,5,4],10:[27,18,13,10,8,6,5,5,4,4]};
function percentages(x){return x.payouts.length===x.paidPlaces?x.payouts:presets[x.paidPlaces]||[100]}
function prizes(x){let p=percentages(x),pool=net(x);return `<h2>Призовые и выплаты</h2><div class="grid"><div class="stat"><span class="tiny">Общий банк</span><b>${money(gross(x))}</b></div><div class="stat clickable" role="button" tabindex="0" onclick="openModal('dealer')" onkeydown="if(event.key==='Enter')openModal('dealer')"><span class="tiny">Дилерам ${x.dealerPct}% ✎</span><b>${money(gross(x)-pool)}</b></div><div class="stat"><span class="tiny">Игрокам</span><b>${money(pool)}</b></div></div><div class="card"><div class="row between"><b>Призовых мест: ${x.paidPlaces}</b>${btn('Настроить',"openModal('prizes')",'smallbtn')}</div><table><tr><th>Место</th><th>Доля</th><th>Сумма</th><th>Выплата</th></tr>${p.map((pct,i)=>{let player=x.players.find(z=>z.place===i+1);return `<tr><td>${i+1}${x.bubblePlace&&i===x.paidPlaces-1?' · Бабл':''}${player?' · '+esc(player.name):''}</td><td>${pct}%</td><td>${money(pool*pct/100)}</td><td>${player?`${money(player.payoutPaid||0)} ${btn('＋',`openModal('pay','${player.id}')`,'smallbtn')}`:'—'}</td></tr>`}).join('')}</table><p class="hint">До завершения аддонов суммы предварительные. Долги по взносам: ${money(gross(x)-received(x))}.</p></div><div class="actions">${btn('ICM / Делёжка',"openModal('icm')")}${btn('Завершить турнир',"finish()",'primary')}</div>`}
function history(x){return `<h2>История и заметки</h2><div class="card"><label>Заметки организатора</label><textarea rows="4" onblur="saveNotes(this.value)">${esc(x.notes)}</textarea></div><div class="card"><h3>Журнал действий</h3><div class="list">${x.events.map(e=>`<div class="item"><span class="tiny">${new Date(e.at).toLocaleString('ru-RU')}</span><div>${esc(e.msg)}</div></div>`).join('')||'<p class="muted">Пока нет событий.</p>'}</div></div>`}
function more(x){return `<h2>Управление</h2><div class="list">${[['Турниры',"db.selected=null;render()"],['Параметры турнира',"openModal('settings')"],['Структура блайндов',"openModal('levels')"],['Управление стадиями',"openModal('stages')"],['Столы и рассадка',"openModal('seating')"],['Отменить последнее действие',"undo()"],['Экспорт резервной копии',"exportBackup()"],['Импорт резервной копии',"$('importFile').click()"],['Поддержать проект',"openModal('support')"]].map(([a,b])=>btn(a,b)).join('')}</div><input type="file" accept="application/json" id="importFile" style="display:none" onchange="importBackup(this.files[0])"><div class="card"><b>Архив турниров</b><div class="list">${db.tournaments.filter(z=>z.status==='finished').map(z=>`<div class="item row between">${esc(z.name)} ${btn('Открыть',`db.selected='${z.id}';tab='tournament';render();try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}`,'smallbtn')}</div>`).join('')||'<p class="muted">Пока пусто.</p>'}</div></div><p class="hint">Данные хранятся только в этом браузере. Регулярно экспортируйте резервную копию.</p>`}
function render(){sync();let x=t();$('app').innerHTML=screen&&x?`<div class="fullscreen"><div class="screen"><div class="row between"><span class="brand">${esc(x.name)}</span>${btn('✕',"screen=false;render()",'ghost')}</div><div class="muted" style="margin-top:25px">УРОВЕНЬ ${x.level+1}</div>${levelHtml(x)}<div class="muted">В игре: ${active(x)} · ${esc(eventText(x))}</div></div></div>`:`<main class="wrap"><div class="top"><div><div class="brand">♠ Poker Manager <span style="font:12px system-ui;color:#d9c690">1.0 · сборка 0.3.5</span></div><div class="sub">by theparkking</div></div>${x?btn('⌄ '+esc(x.name),"db.selected=null;render()",'smallbtn'):''}</div>${notification?`<div class="card gold">${esc(notification)}</div>`:''}${x?tab==='tournament'?tournament(x):tab==='players'?players(x):tab==='prizes'?prizes(x):tab==='history'?history(x):more(x):home()}${x?nav():''}</main>`;if(modal)renderModal()}
function openModal(name,extra){modal={name,extra};renderModal()};function closeModal(){modal=null;document.getElementById('modalRoot')?.remove();render()}
function formModal(title,body,buttons=''){let el=document.createElement('div');el.className='modalwrap';el.id='modalRoot';el.addEventListener('click',event=>{if(!event.target.closest('.modal'))closeModal()});el.innerHTML=`<div class="modal"><div class="row between"><h2>${title}</h2>${btn('✕',"closeModal()",'ghost')}</div>${body}${buttons}</div>`;document.body.appendChild(el)}
function calculateLateClose(){
 const minutes=Number(val('lateMinutes'));
 const level=Math.max(1,Math.ceil(Math.max(1,minutes)/18));
 $('closeLevel').value=level;
 $('latePreview').textContent='Автоматически: после уровня '+level+' ('+(level*18)+' минут).';
}
function setLateCloseManual(){
 const level=Math.max(1,Math.floor(Number(val('closeLevel'))||1));
 $('latePreview').textContent='Вручную: после уровня '+level+' ('+(level*18)+' минут).';
}
function saveLateClose(){
 const level=Math.floor(Number(val('closeLevel')));
 if(!Number.isFinite(level)||level<1)return alert('Укажите уровень не меньше 1.');
 if(!confirm('Закрыть позднюю регистрацию после завершения уровня '+level+'?'))return;
 act(x=>{x.lateCloseLevel=level;log(x,'Поздняя регистрация: закрытие после уровня '+level)});
 closeModal();
}
function val(k){return $(k)?.value};function num(k){return Number(val(k))||0};

}

case 'player':{let p=x.players.find(z=>z.id===m.extra);title=esc(p.name);body=`<div class="pill">${p.active?'В игре':'Выбыл'}</div><label>Имя</label><input id="editPlayerName" value="${esc(p.name)}"><div class="actions" style="margin-top:10px">${btn('Сохранить имя',`renamePlayer('${p.id}')`)}${btn('Рассадка',"closeModal();openModal('seating')")}</div><h3>Операции</h3><div class="list">${p.ops.map(o=>`<div class="item row between"><div>${esc({buyin:'Вход',reentry:'Повторный вход',rebuy:'Ребай',addon:'Аддон'}[o.type])} · ${money(o.amount)}<div class="tiny">${o.paid?'Оплачено':'Не оплачено'} ${o.void?'· Отменено':''}</div></div>${!o.void?btn(o.paid?'Отменить':'Оплачено',`opAction('${p.id}','${o.id}','${o.paid?'void':'paid'}')`,'smallbtn'):''}</div>`).join('')}</div><label>Место выбывания (необязательно)</label><input id="playerPlace" type="number" min="1" max="${x.players.length}" value="${p.place||''}">${btn('Сохранить место',`setPlace('${p.id}')`)}<p class="hint">При одновременном выбывании порядок можно исправить вручную.</p>`;break}
case 'manage':title='Управление турниром';body=`<p class="hint">Быстрые действия организатора. Управление стадиями — по нажатию на текущий статус на главном экране.</p><div class="list">${btn('Параметры турнира',"openModal('settings')")}${btn('Структура блайндов',"openModal('levels')")}${btn('Изменить время и уровень',"openModal('time')")}${btn('Управление стадиями',"openModal('stages')")}${btn('Перейти к аддонам',"changeStage('addon')")}${btn('Рассадка',"openModal('seating')")}${btn('Отменить последнее действие',"closeModal();undo()")}${btn('Экспорт резервной копии',"exportBackup()")}${btn('Завершить турнир',"closeModal();finish()",'danger')}</div>`;break;
case 'stages':title='Управление стадиями';body=`<div class="card">Текущая стадия: <b class="gold">${esc(eventText(x))}</b><p class="hint">При переключении начинается следующий уровень и полный отсчёт времени выбранной стадии.</p></div><div class="list">${btn('Поздняя регистрация (18 минут)'+(x.stage==='late'?' ✓':''),"changeStage('late')",x.stage==='late'?'stage-current':'')}${btn('Основная стадия (15 минут)'+(x.stage==='main'?' ✓':''),"changeStage('main')",x.stage==='main'?'stage-current':'')}${btn('Финальный стол (12 минут)'+(x.stage==='final'?' ✓':''),"changeStage('final')",x.stage==='final'?'stage-current':'')}</div><p class="hint">Аддоны для игроков доступны отдельно в управлении турниром.</p><div class="card"><b>Автозакрытие поздней регистрации</b><p class="hint">Выберите продолжительность в минутах или укажите уровень вручную. Регистрация закроется после завершения выбранного уровня.</p><label>Продолжительность поздней регистрации, минут</label><input type="number" id="lateMinutes" min="1" value="${(x.lateCloseLevel||9)*18}" oninput="calculateLateClose()"><p class="hint" id="latePreview">Закроется после уровня ${x.lateCloseLevel} (${x.lateCloseLevel*18} минут).</p><label>Закрыть после уровня (можно изменить вручную)</label><input type="number" id="closeLevel" min="1" value="${x.lateCloseLevel}" oninput="setLateCloseManual()">${btn('Сохранить',"saveLateClose()",'primary')}</div>`;break;

case 'settings':title='Настройки турнира';body=`<label>Название</label><input id="setName" value="${esc(x.name)}"><div class="fieldgrid">${[['buyin','Вход'],['reentry','Повторный вход'],['rebuy','Ребай'],['addon','Аддон'],['dealerPct','Дилерам, %'],['startingChips','Стартовых фишек'],['rebuyChips','Фишек за ребай'],['addonChips','Фишек за аддон']].map(([k,l])=>`<div><label>${l}</label><input type="number" id="set_${k}" value="${x[k]}"></div>`).join('')}</div><label><input type="checkbox" style="width:auto" id="setAnte" ${x.ante?'checked':''}> Включить анте</label><div class="fieldgrid"><div><label>Анте с уровня</label><input type="number" id="setAnteStart" value="${x.anteStart}"></div><div><label>Анте (множитель BB)</label><input type="number" step="0.1" id="setAnteAmount" value="${x.anteAmount}"></div></div><label>Тип анте</label><select id="setAnteType"><option value="bb" ${x.anteType==='bb'?'selected':''}>BB Ante</option><option value="each" ${x.anteType==='each'?'selected':''}>Каждый игрок</option></select><h3>Звуковые настройки</h3><label><input type="checkbox" style="width:auto" id="setVoiceBlinds" ${x.voiceBlinds!==false?'checked':''}> Озвучка блайндов по кнопке 🔊</label><label><input type="checkbox" style="width:auto" id="setDecisionVoice" ${x.decisionVoice!==false?'checked':''}> Голосовое предупреждение при 30-секундном решении</label><label>За сколько секунд предупредить: <b id="warnValue">${x.decisionWarnAt??5}</b></label><input type="range" id="setDecisionWarnAt" min="0" max="10" step="1" value="${x.decisionWarnAt??5}" oninput="document.getElementById('warnValue').textContent=this.value"><p class="hint">0 — отключить раннее предупреждение. Озвучка работает при открытом приложении и зависит от поддержки речи браузером.</p>${btn('🔊 Проверить звук',"testSpeech()")}`;footer=btn('Сохранить',"saveSettings()",'primary');break;

function changeStage(s){
 const labels={late:'Поздняя регистрация',addon:'Аддоны',main:'Основная стадия',final:'Финальный стол'};
 const x=t();if(!x)return;
 if(x.stage===s){alert('Эта стадия уже активна. Для изменения времени используйте кнопку «Время».');return}
 const minutes=s==='late'?18:s==='final'?12:15;
 const level=Math.min(x.level+2,x.levels.length);
 if(!confirm('Перейти к стадии «'+labels[s]+'»?\n\nСледующий уровень: '+level+'.\nТаймер: '+minutes+':00.'))return;
 act(x=>{
  x.stage=s;
  x.level=Math.min(x.level+1,x.levels.length-1);
  x.remaining=minutes*60;
  if(x.paused){x.deadline=null}else{play(x)}
  log(x,'Переход на стадию «'+labels[s]+'», уровень '+(x.level+1)+', '+minutes+' минут');
 });
 closeModal();
}
function previousLevel(){

 if(!confirm('Вернуться с уровня '+(target+1)+' на уровень '+target+'?\\nВремя уровня будет установлено на '+minutes+':00.\\nСтадия турнира не изменится.'))return;
 act(x=>{
   x.level=Math.max(0,x.level-1);
   x.remaining=duration(x)*60;
   if(x.paused)x.deadline=null;else play(x);
   log(x,'Возврат на предыдущий уровень '+(x.level+1));
 });
}

function maybeWarnDecision(remaining){
 const x=t();if(!x||x.id!==decisionOwner||decisionVoiceDone||x.decisionVoice===false)return;
 const threshold=Math.min(10,Math.max(0,Number(x.decisionWarnAt??5)));
 if(threshold>0&&remaining>0&&remaining<=threshold){decisionVoiceDone=true;speakRussian('Осталось '+remaining+' секунд. Пора принимать решение.')}
}
function decision(){

function cancelDecision(){

}
function showDecisionOverlay(){
 document.getElementById('decisionOverlay')?.remove();
 if(!decisionEnd||decisionEnd<=Date.now())return;
 const overlay=document.createElement('div');
 overlay.id='decisionOverlay';overlay.className='decision-overlay';
 overlay.innerHTML='<button class="decision-circle" type="button" aria-label="Отменить 30 секунд" onclick="cancelDecision()"><span id="decisionNumber" class="decision-number">30</span><span class="decision-caption">СЕКУНД НА РЕШЕНИЕ</span><span class="decision-help">Нажмите на круг, чтобы отменить</span></button>';
 overlay.addEventListener('click',e=>{if(e.target===overlay)cancelDecision()});

}
function updateDecisionOverlay(){

 const label=document.getElementById('decisionNumber');if(label)label.textContent=remaining;maybeWarnDecision(remaining);
 overlay.querySelector('.decision-circle')?.classList.toggle('urgent',remaining<=5);
 if(remaining===0)cancelDecision();
}

 const n=Number(val('paidPlaces'));if(!Number.isInteger(n)||n<1||n>10)return alert('Выберите от 1 до 10 мест');
 const holder=$('prizeFields');holder.dataset.count='reset';
 holder.innerHTML=(presets[n]||[100]).map((pct,i)=>`<label>${i+1} место${holder.dataset.bubble==='true'&&i===n-1?' (бабл)':''}, %</label><input id="pct_${i}" type="number" min="0" max="100" step="0.01" inputmode="decimal" value="${pct}">`).join('');
 holder.dataset.count=String(n);holder.dataset.bubble='false';
}
function prizeInputs(){const n=Number(val('paidPlaces'));return Array.from({length:n},(_,i)=>Number(String(val('pct_'+i)||'0').replace(',','.')))}
function roundShares(shares,target){const out=[];let sum=0;for(let i=0;i<shares.length;i++){let v=i===shares.length-1?Math.round((target-sum)*100)/100:Math.round(shares[i]*100)/100;out.push(v);sum+=v}return out}
function addBubblePrize(){
 const holder=$('prizeFields'),n=Number(val('paidPlaces'));
 if(holder.dataset.bubble==='true')return alert('Бабл уже добавлен. Измените его процент в последнем поле.');
 if(n>=10)return alert('Максимум 10 оплачиваемых мест.');
 const current=prizeInputs();if(current.some(v=>!Number.isFinite(v)||v<0)||Math.abs(current.reduce((a,b)=>a+b,0)-100)>.01)return alert('Сначала настройте текущие доли так, чтобы их сумма была 100%.');
 const raw=prompt('Какой процент выделить на бабл? Например, 3', '3');if(raw===null)return;
 const bubble=Number(raw.replace(',','.'));if(!Number.isFinite(bubble)||bubble<=0||bubble>=100)return alert('Укажите процент больше 0 и меньше 100.');
 const adjusted=roundShares(current.map(v=>v*(100-bubble)/100),100-bubble);const values=[...adjusted,bubble];
 $('paidPlaces').value=n+1;holder.dataset.count=String(n+1);holder.dataset.bubble='true';
 holder.innerHTML=values.map((pct,i)=>`<label>${i+1} место${i===n?' (бабл)':''}, %</label><input id="pct_${i}" type="number" min="0" max="100" step="0.01" inputmode="decimal" value="${pct}" ${i===n?'onchange="changeBubblePct()"':''}>`).join('');
}
function changeBubblePct(){
 const holder=$('prizeFields');if(holder.dataset.bubble!=='true')return;
 const values=prizeInputs(),bubble=values.at(-1),previous=values.slice(0,-1);
 if(!Number.isFinite(bubble)||bubble<=0||bubble>=100)return alert('Процент бабла должен быть больше 0 и меньше 100.');
 const sum=previous.reduce((a,b)=>a+b,0);if(sum<=0)return alert('Сумма основных призовых долей должна быть больше 0.');
 const adjusted=roundShares(previous.map(v=>v/sum*(100-bubble)),100-bubble);
 adjusted.forEach((v,i)=>{$('pct_'+i).value=v});
}
function removeBubblePrize(){
 const holder=$('prizeFields');if(holder.dataset.bubble!=='true')return alert('Бабл не добавлен.');
 const values=prizeInputs().slice(0,-1),sum=values.reduce((a,b)=>a+b,0);
 if(sum<=0)return alert('Невозможно пересчитать нулевые доли.');
 const adjusted=roundShares(values.map(v=>v/sum*100),100),n=adjusted.length;
 $('paidPlaces').value=n;holder.dataset.count=String(n);holder.dataset.bubble='false';
 holder.innerHTML=adjusted.map((pct,i)=>`<label>${i+1} место, %</label><input id="pct_${i}" type="number" min="0" max="100" step="0.01" inputmode="decimal" value="${pct}">`).join('');
}
function savePrizeSettings(){
 const n=Number(val('paidPlaces'));if(!Number.isInteger(n)||n<1||n>10)return alert('Введите целое число оплачиваемых мест от 1 до 10');
 const arr=Array.from({length:n},(_,i)=>Number(String(val('pct_'+i)??'').replace(',','.')));
 if(arr.some(v=>!Number.isFinite(v)||v<0||v>100))return alert('Каждый процент должен быть от 0 до 100');
 const sum=arr.reduce((a,b)=>a+b,0);
 if(Math.abs(sum-100)>0.001)return alert('Сумма процентов должна быть 100%. Сейчас: '+sum.toFixed(2)+'%');
 const x=t();
 if(x.players.length&&n>x.players.length&&!confirm('Призовых мест больше, чем игроков. Сохранить на будущее?'))return;
 act(x=>{x.paidPlaces=n;x.payouts=arr;x.bubblePlace=$('prizeFields').dataset.bubble==='true';log(x,'Призовые: '+n+' мест; '+arr.join(' / ')+'%')});
 closeModal();
}
function payPlayer(pid){let amt=num('payAmount');if(amt<=0)return alert('Укажите сумму');act(x=>{let p=x.players.find(z=>z.id===pid);p.payoutPaid=(p.payoutPaid||0)+amt;log(x,'Выплата '+p.name+': '+money(amt))});closeModal()}
function changeSeats(i,d){act(x=>{let table=x.tables[i];table.seats=Math.max(2,Math.min(10,table.seats+d));x.players.filter(p=>p.table===table.id&&p.seat>table.seats).forEach(p=>{p.table=null;p.seat=null})});closeModal();openModal('seating')}
function seatPlayer(tid,seat,pid){act(x=>{x.players.filter(p=>p.table===tid&&p.seat===seat).forEach(p=>{p.table=null;p.seat=null});if(pid){let p=x.players.find(z=>z.id===pid);p.table=tid;p.seat=seat}log(x,'Обновлена рассадка')});closeModal();openModal('seating')}
function randomSeating(){if(!confirm('Случайно пересадить всех активных игроков?'))return;act(x=>{let seats=x.tables.flatMap(table=>Array.from({length:table.seats},(_,i)=>({table:table.id,seat:i+1}))).sort(()=>Math.random()-.5);x.players.filter(p=>p.active).forEach((p,i)=>{p.table=seats[i]?.table||null;p.seat=seats[i]?.seat||null});log(x,'Случайная рассадка')});closeModal();openModal('seating')}
function saveNotes(value){act(x=>{x.notes=value;log(x,'Заметки обновлены')})}
function finish(){let x=t(),problems=[];if(x.stage==='late'||x.stage==='addon')problems.push('Регистрация или аддоны не завершены');if(x.players.some(p=>p.ops.some(o=>!o.void&&!o.paid)))problems.push('Есть неоплаченные взносы');if(x.players.some(p=>!p.active&&!p.place))problems.push('Не всем выбывшим назначены места');let paid=x.players.reduce((s,p)=>s+(p.payoutPaid||0),0);if(Math.abs(paid-net(x))>.01)problems.push('Выданные призовые не совпадают с фондом');if(problems.length&&!confirm('Проверка перед завершением:\n• '+problems.join('\n• ')+'\n\nВсё равно завершить?'))return;if(!problems.length&&!confirm('Завершить турнир?'))return;act(x=>{pause(x);x.status='finished';log(x,'Турнир завершён'+(problems.length?' с предупреждениями: '+problems.join('; '):''))})}
function exportBackup(){let blob=new Blob([JSON.stringify({format:'poker-manager-1',exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='poker-manager-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.format!=='poker-manager-1'||!Array.isArray(obj.data?.tournaments))throw Error('Некорректный файл');if(!confirm('Заменить текущую базу импортированной? Сначала сохраните резервную копию!'))return;db=obj.data;save();modal=null;render()}catch(e){alert('Ошибка импорта: '+e.message)}}
setInterval(()=>{sync();let x=t();if(x){let clock=$('mainClock');if(clock)clock.textContent=fmt(live(x));let bar=$('bar');if(bar)bar.style.width=Math.min(100,100*live(x)/(duration(x)*60))+'%';let d=$('decisionLabel');if(d)d.textContent=decisionOwner===x.id&&decisionEnd>Date.now()?fmt((decisionEnd-Date.now())/1000):'30 сек на решение';updateDecisionOverlay();if(decisionEnd&&decisionEnd<=Date.now()){cancelDecision();if(d)d.textContent='30 сек на решение'}}},250);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
document.addEventListener('pointerdown',e=>{const el=document.getElementById('pmToast');if(el&&!el.contains(e.target))el.remove()},true);
</script></body></html>
